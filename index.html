<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>아스트라 전투 시뮬레이션</title>
    <style>
        body { background: #1a1a1a; display: flex; flex-direction: column; align-items: center; color: white; font-family: sans-serif; margin: 0; padding: 20px; }
        canvas { border: 2px solid #444; background: #222; cursor: crosshair; box-shadow: 0 4px 8px rgba(0,0,0,0.5); }
        .controls { margin-top: 15px; text-align: center; line-height: 1.6; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 10px; }
        .status { font-weight: bold; color: #ff3e3e; }
        .assets { display: none; }
    </style>
</head>
<body>
    <h2>아스트라 전투 시뮬레이션</h2>
    <canvas id="simCanvas" width="800" height="450"></canvas>
    <div class="controls">
        <p>상태: <span id="stateText" class="status">IDLE</span> | 탄환: <span id="ammoText">6</span>/6</p>
        <p><b>[마우스 클릭 유지]</b>: 차징 | <b>[E 키]</b>: 버스트 스킬 | <b>[R 키]</b>: 장전 (Reload)</p>
        <small>※ 적색 원을 타격하여 버스트 게이지를 채우세요!</small>
    </div>

    <div class="assets">
        <img id="bgImage" src="이미지/배경.png">
        <img id="charImageIdle" src="이미지/전투시작.png">
        <img id="charImageAttack" src="이미지/사격자세.png">
        
        <img id="reload1" src="이미지/장전1.png">
        <img id="reload2" src="이미지/장전2.png">
        <img id="reload3" src="이미지/장전3.png">

        <!-- 버스트 스킬 영상 (파일명을 실제 영상 파일에 맞게 수정해주세요) -->
        <video id="burstVideo" src="이미지/버스트스킬.mp4" preload="auto" muted playsinline></video>
    </div>

<script>
const canvas = document.getElementById('simCanvas');
const ctx = canvas.getContext('2d');
const stateText = document.getElementById('stateText');
const ammoText = document.getElementById('ammoText');

const assets = {
    bg: document.getElementById('bgImage'),
    idle: document.getElementById('charImageIdle'),
    attack: document.getElementById('charImageAttack'),
    reload: [
        document.getElementById('reload1'), 
        document.getElementById('reload2'), 
        document.getElementById('reload3')
    ],
    burstVideo: document.getElementById('burstVideo')
};

let state = 'IDLE'; 
let ammo = 6;
const maxAmmo = 6;
let burstGauge = 0;
const maxBurst = 3;
let shake = 0;
let particles = [];
let targets = []; 

let isMouseDown = false;
let chargeTime = 0;
const maxChargeTime = 1500;
let lastTimestamp = 0;

let isBurstActive = false;
let burstStartTime = 0;

let reloadStartTime = 0;
const reloadDuration = 1500; 

// 영상 종료 시 자동으로 버스트 상태 해제
assets.burstVideo.addEventListener('ended', () => {
    isBurstActive = false;
    state = 'IDLE';
    stateText.innerText = "IDLE";
    targets = [];
});

canvas.addEventListener('mousedown', () => {
    if (isBurstActive || state === 'RELOAD') return;
    if (ammo > 0) {
        isMouseDown = true;
        chargeTime = 0;
        state = 'ATTACK';
        stateText.innerText = "ATTACK";
    } else { 
        startReload(); 
    }
});

canvas.addEventListener('mouseup', () => {
    if (isMouseDown && state === 'ATTACK') { fire(); }
    isMouseDown = false;
});

window.addEventListener('keydown', (e) => {
    if (e.key.toLowerCase() === 'r' && state !== 'RELOAD' && !isBurstActive) startReload();
    if (e.key.toLowerCase() === 'e') startBurst();
});

function fire() {
    const chargeRatio = Math.min(chargeTime / maxChargeTime, 1);
    ammo--;
    ammoText.innerText = ammo;
    shake = 5 + (chargeRatio * 10); 

    for (let i = targets.length - 1; i >= 0; i--) {
        let t = targets[i];
        let dist = Math.hypot(mouseX - t.x, mouseY - t.y);
        
        if (dist < t.r) {
            targets.splice(i, 1);
            if (burstGauge < maxBurst) burstGauge++;
            createExplosion(t.x, t.y, chargeRatio);
            break; 
        }
    }

    state = 'IDLE';
    stateText.innerText = "IDLE";
    chargeTime = 0;
    
    if (ammo <= 0) startReload();
}

function startBurst() {
    if (burstGauge >= maxBurst && !isBurstActive) {
        isBurstActive = true;
        burstStartTime = performance.now();
        burstGauge = 0; 
        state = 'BURST';
        stateText.innerText = "BURST";
        shake = 0;

        // 영상을 처음부터 재생
        const video = assets.burstVideo;
        video.currentTime = 0;
        const playPromise = video.play();
        if (playPromise !== undefined) {
            playPromise.catch(err => {
                console.warn("버스트 영상 재생 실패:", err);
                // 재생에 실패하면 바로 IDLE 복귀
                isBurstActive = false;
                state = 'IDLE';
                stateText.innerText = "IDLE";
            });
        }
    }
}

function startReload() {
    if (state === 'RELOAD' || isBurstActive) return;
    state = 'RELOAD';
    stateText.innerText = "RELOADING...";
    isMouseDown = false;
    reloadStartTime = performance.now(); 
}

function createExplosion(x, y, ratio) {
    for(let i=0; i<30 * ratio; i++) {
        particles.push({
            x: x, y: y, vx: (Math.random()-0.5)*20, vy: (Math.random()-0.5)*20,
            life: 40, color: '#ff3e3e'
        });
    }
}

let mouseX = 400, mouseY = 225;
canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    mouseX = e.clientX - rect.left;
    mouseY = e.clientY - rect.top;
});

function update(timestamp) {
    const deltaTime = timestamp - lastTimestamp;
    lastTimestamp = timestamp;

    if (shake > 0) shake *= 0.85;

    if (state === 'RELOAD') {
        const elapsed = timestamp - reloadStartTime;
        if (elapsed >= reloadDuration) {
            ammo = maxAmmo;
            ammoText.innerText = ammo;
            state = 'IDLE';
            stateText.innerText = "IDLE";
        }
    }

    if (!isBurstActive && state !== 'RELOAD') {
        if (isMouseDown && state === 'ATTACK') {
            chargeTime = Math.min(chargeTime + deltaTime, maxChargeTime);
        }
        
        if (targets.length === 0 && Math.random() < 0.04) {
            const spawnCount = Math.floor(Math.random() * 2) + 2; 
            for (let i = 0; i < spawnCount; i++) {
                targets.push({
                    x: 150 + Math.random() * 500, 
                    y: 80 + Math.random() * 150,  
                    r: 35,
                    timer: 150 + Math.random() * 30 
                });
            }
        }

        for (let i = targets.length - 1; i >= 0; i--) {
            targets[i].timer--;
            if (targets[i].timer <= 0) {
                targets.splice(i, 1); 
                shake = 15; 
            }
        }
    }

    particles = particles.filter(p => p.life > 0);
    particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life--; });

    draw(timestamp);
    requestAnimationFrame(update);
}

function draw(timestamp = 0) {
    ctx.save();
    
    if (!isBurstActive && shake > 0.5) {
        ctx.translate((Math.random()-0.5)*shake, (Math.random()-0.5)*shake);
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (isBurstActive) {
        // 버스트 컷신 - 영상의 현재 프레임을 캔버스에 그림
        const video = assets.burstVideo;
        const elapsed = timestamp - burstStartTime;
        
        if (video.readyState >= 2) { // HAVE_CURRENT_DATA 이상
            // 비디오를 캔버스 크기에 맞춰 그리기 (cover 방식: 비율 유지하며 꽉 채움)
            const videoRatio = video.videoWidth / video.videoHeight;
            const canvasRatio = canvas.width / canvas.height;
            
            let drawW, drawH, drawX, drawY;
            if (videoRatio > canvasRatio) {
                // 영상이 더 가로로 길면 -> 세로 기준으로 맞춤
                drawH = canvas.height;
                drawW = drawH * videoRatio;
                drawX = (canvas.width - drawW) / 2;
                drawY = 0;
            } else {
                // 영상이 더 세로로 길면 -> 가로 기준으로 맞춤
                drawW = canvas.width;
                drawH = drawW / videoRatio;
                drawX = 0;
                drawY = (canvas.height - drawH) / 2;
            }
            
            ctx.drawImage(video, drawX, drawY, drawW, drawH);

            // 시작 후 0.3초 동안 화이트 플래시 효과 유지
            if (elapsed < 300) {
                ctx.fillStyle = `rgba(255, 255, 255, ${0.6 * (1 - elapsed / 300)})`;
                ctx.fillRect(0, 0, canvas.width, canvas.height);
            }
        } else {
            // 영상이 아직 로드 중일 때 검은 화면 + 로딩 표시
            ctx.fillStyle = "#000";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#fff";
            ctx.font = "bold 24px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("LOADING BURST...", canvas.width / 2, canvas.height / 2);
            ctx.textAlign = "start";
        }
    } else {
        // 배경 그리기
        if (assets.bg && assets.bg.complete && assets.bg.naturalWidth > 0) {
            ctx.drawImage(assets.bg, 0, 0, canvas.width, canvas.height);
        } else {
            ctx.fillStyle = "#333";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
        }

        const imgX = 240, imgY = 130; 
        let img;

        if (state === 'RELOAD') {
            const elapsed = timestamp - reloadStartTime;
            let reloadIndex = Math.floor(elapsed / 500); 
            if (reloadIndex > 2) reloadIndex = 2; 
            img = assets.reload[reloadIndex];
        } else if (state === 'ATTACK') {
            img = assets.attack;
        } else {
            img = assets.idle;
        }

        // 캐릭터 발밑 그림자
        ctx.save();
        ctx.fillStyle = "rgba(0, 0, 0, 0.5)";
        ctx.beginPath();
        ctx.ellipse(imgX + 160, imgY + 400, 100, 15, 0, 0, Math.PI * 2); 
        ctx.fill();
        ctx.restore();

        // 캐릭터 이미지
        if (img && img.complete && img.naturalWidth > 0) {
            ctx.drawImage(img, imgX, imgY, 320, 420);
        }

        if (state !== 'RELOAD') {
            targets.forEach(t => {
                ctx.beginPath();
                ctx.arc(t.x, t.y, t.r, 0, Math.PI*2);
                ctx.strokeStyle = "#ff3e3e"; 
                ctx.lineWidth = 4; 
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(t.x, t.y, t.r - 6, -Math.PI/2, (-Math.PI/2) + (Math.PI*2 * (t.timer/180)));
                ctx.strokeStyle = "rgba(255, 255, 255, 0.8)";
                ctx.lineWidth = 4;
                ctx.stroke();
            });

            const chargeRatio = chargeTime / maxChargeTime;
            ctx.strokeStyle = (chargeRatio >= 1) ? "#00ffff" : "#00ff00";
            ctx.beginPath();
            ctx.arc(mouseX, mouseY, 20 + (1 - chargeRatio) * 20, 0, Math.PI * 2);
            ctx.stroke();

            if (isMouseDown && state === 'ATTACK') {
                ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.fillRect(mouseX - 30, mouseY + 40, 60, 8);
                ctx.fillStyle = (chargeRatio >= 1) ? "#00ffff" : "#fff";
                ctx.fillRect(mouseX - 30, mouseY + 40, 60 * chargeRatio, 8);
            }
        } else {
            ctx.strokeStyle = "red";
            ctx.beginPath();
            ctx.arc(mouseX, mouseY, 20, 0, Math.PI * 2);
            ctx.stroke();
            
            ctx.fillStyle = "red";
            ctx.font = "bold 14px sans-serif";
            ctx.fillText("RELOADING", mouseX - 40, mouseY + 40);
        }

        // 버스트 게이지 UI
        const gaugeX = 650, gaugeY = 150, gaugeWidth = 30, gaugeHeight = 150;
        ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
        ctx.fillRect(gaugeX, gaugeY, gaugeWidth, gaugeHeight);
        ctx.strokeStyle = "#fff"; ctx.lineWidth = 2;
        ctx.strokeRect(gaugeX, gaugeY, gaugeWidth, gaugeHeight);

        const cellHeight = gaugeHeight / maxBurst;
        for (let i = 0; i < burstGauge; i++) {
            ctx.fillStyle = (burstGauge === maxBurst) ? "#00ffff" : "#ffcc00";
            ctx.fillRect(gaugeX + 2, gaugeY + gaugeHeight - (i + 1) * cellHeight + 2, gaugeWidth - 4, cellHeight - 4);
        }
        
        ctx.fillStyle = "#fff";
        ctx.font = "bold 16px sans-serif";
        ctx.fillText("BURST", gaugeX - 10, gaugeY + gaugeHeight + 25);

        if (burstGauge >= maxBurst && state !== 'RELOAD') {
            ctx.fillStyle = "#00ffff";
            ctx.font = "bold 20px sans-serif";
            ctx.fillText("PRESS [E]", gaugeX - 30, gaugeY - 10);
            ctx.strokeStyle = `rgba(0, 255, 255, ${0.5 + 0.5 * Math.sin(timestamp / 150)})`;
            ctx.lineWidth = 4;
            ctx.strokeRect(gaugeX - 2, gaugeY - 2, gaugeWidth + 4, gaugeHeight + 4);
        }
    }

    particles.forEach(p => {
        ctx.fillStyle = p.color; ctx.globalAlpha = p.life / 40;
        ctx.fillRect(p.x, p.y, 4, 4);
    });

    ctx.restore();
}

requestAnimationFrame(update);
</script>
</body>

</html>
